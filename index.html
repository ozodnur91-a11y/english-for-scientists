esc(q.explanation)}</p><div class="passage">${esc(q.passage)}</div></details>`).join('')}</section>`}function historyView(){app.innerHTML=`<section class="card"><h2>📚 Natijalar tarixi</h2><button class="secondary" onclick="home()">← Bosh sahifa</button><button class="secondary" onclick="exportData()">⬇ JSON eksport</button><label class="field">📂 JSON import<input type="file" accept="application/json" onchange="importData(this)"></label>${records.length?records.map(r=>{let s=score(r);return `<div class="card"><b>${esc(r.level)}</b> · ${new Date(r.date).toLocaleString('uz-UZ')} · <b>${s.correct}/${s.items.length} (${s.items.length?Math.round(s.correct/s.items.length*100):0}%)</b><div><button onclick="results(records.find(x=>x.id==='${r.id}'))">Tahlil</button><button class="secondary" onclick="start(records.find(x=>x.id==='${r.id}'))">Qayta ishlash</button><button class="secondary" onclick="removeRecord('${r.id}')">O‘chirish</button></div></div>`}).join(''):'<p>Hozircha natijalar yo‘q.</p>'}</section>`}function mistakes(){let grouped={};for(let r of records){for(let id of r.ids){let q=getQ(r.level,id);if(q&&r.answers[id]!==q.answer)(grouped[r.level]??=new Set()).add(id)}}let levels=Object.keys(grouped);if(!levels.length){alert('Hozircha xato savollar yo‘q.');return}app.innerHTML=`<section class="card"><h2>🎯 Xatolar ustida ishlash</h2><p>Qaysi darajadagi xato savollarni qayta ishlamoqchisiz?</p>${levels.map(l=>`<button onclick="start(null,shuffle([...grouped['${l}']].map(id=>getQ('${l}',id))).slice(0,50))">${l} (${grouped[l].size})</button>`).join('')}<button class="secondary" onclick="home()">Orqaga</button></section>`}function removeRecord(id){if(confirm('Natijani o‘chirasizmi?')){records=records.filter(r=>r.id!==id);save();historyView()}}function exportData(){let url=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='physics-reading-results.json';a.click();setTimeout(()=>U
